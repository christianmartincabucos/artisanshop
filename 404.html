<!doctype html>
<html lang="de-CH">
<head>
<script src="/site-base.js"></script>
  <script src="/local-recovery.js" defer></script>
<link rel="stylesheet" href="/site-navigation.css">
<script src="/site-navigation.js" defer></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | ArtisanShop</title>
  <link rel="stylesheet" href="/theme/70f6c4feb09e74b6b88d7a2f53c717b2/css/all.css">
  <style>body{background:#f7f8f5;color:#274533}.not-found{max-width:48rem;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #dfe5df;border-radius:12px}a{color:#245e40}</style>
</head>
<body>
  <main class="not-found">
    <p>404</p>
    <h1>Diese Seite ist im wiederhergestellten Archiv nicht vorhanden.</h1>
    <p>Diese Seite wurde nicht mit dem Archiv wiederhergestellt. Durchsuche die gespeicherten Seiten nach einem passenden Titel oder Produktcode.</p>
    <form action="/search/" method="get" style="display:flex;gap:.5rem;flex-wrap:wrap;margin:1.5rem 0">
      <label for="missing-route-search" style="position:absolute;left:-10000px">Suchbegriff</label>
      <input id="missing-route-search" name="search" type="search" style="flex:1 1 16rem;padding:.7rem;border:1px solid #aab8ae;border-radius:6px;font:inherit" placeholder="Produkt oder Thema suchen">
      <button style="padding:.7rem 1rem;border:0;border-radius:6px;background:#245e40;color:#fff;font:inherit" type="submit">Archiv durchsuchen</button>
    </form>
    <nav aria-label="Verfügbare Seiten">
      <ul>
        <li><a href="/kueche/">Zur Startseite</a></li>
        <li><a href="/produkte/">Produkte durchsuchen</a></li>
        <li><a href="/ratgeber/">Ratgeber öffnen</a></li>
        <li><a href="/service/kundenservice/">Kundenservice</a></li>
      </ul>
    </nav>
  </main>
  <script>
    (function () {
      const input = document.getElementById('missing-route-search');
      const slug = window.location.pathname.split('/').filter(Boolean).pop() || '';
      input.value = decodeURIComponent(slug).replace(/[-_]+/g, ' ').replace(/\.html$/i, '');
    })();
  </script>
</body>
</html>
